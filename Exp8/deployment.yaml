
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-docker-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: k8s-docker-demo
  template:
    metadata:
      labels:
        app: k8s-docker-demo
    spec:
      containers:
        - name: web
          image: k8s-docker-demo:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
